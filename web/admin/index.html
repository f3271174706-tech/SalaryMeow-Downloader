<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#294f7e" />
    <title>FZP Console</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin-assets/design-system/shared/foundations.css" />
    <link rel="stylesheet" href="/admin-assets/design-system/spatial-liquid/spatial-liquid.css" />
    <link rel="stylesheet" href="/admin-assets/styles.css" />
    <script src="/admin-assets/design-system/spatial-liquid/vendor/html2canvas.min.js" defer></script>
    <script src="/admin-assets/design-system/spatial-liquid/vendor/liquidGL.js" defer></script>
    <script src="/admin-assets/app.js" defer></script>
    <script src="/admin-assets/specular-button.js" type="module"></script>
  </head>
  <body class="fzp-root fzp-spatial">
    <div class="fzp-spatial-background" aria-hidden="true"></div>
    <div class="fzp-spatial-depth" aria-hidden="true">
      <span class="fzp-orbit fzp-orbit--one"></span>
      <span class="fzp-orbit fzp-orbit--two"></span>
      <span class="fzp-depth-line"></span>
    </div>

    <main class="fzp-shell">
      <section id="loginView" class="fzp-auth" aria-labelledby="loginTitle" data-fzp-liquid>
        <header class="fzp-brand">
          <span class="fzp-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M8 8.5h16M8 16h11M8 23.5h16" />
              <circle cx="23" cy="16" r="2.5" />
            </svg>
          </span>
          <span id="brandName">FZP Console</span>
        </header>

        <div class="fzp-auth__content">
          <p class="fzp-eyebrow">PRIVATE WORKSPACE</p>
          <h1 id="loginTitle">欢迎回来</h1>
          <p id="brandDescription" class="fzp-lead">登录以继续进入管理工作台。</p>

          <form id="loginForm" class="fzp-form" novalidate>
            <div class="fzp-field">
              <label for="username">用户名</label>
              <div class="fzp-input-wrap" data-fzp-liquid>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
                </svg>
                <input id="username" name="username" autocomplete="username" required maxlength="128" />
              </div>
            </div>

            <div class="fzp-field">
              <label for="password">密码</label>
              <div class="fzp-input-wrap" data-fzp-liquid>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <rect x="4" y="10" width="16" height="11" rx="3" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2" />
                </svg>
                <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" />
                <button id="togglePassword" class="fzp-icon-button" type="button" aria-label="显示密码">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                </button>
              </div>
            </div>

            <p id="formMessage" class="fzp-message" role="alert" aria-live="polite"></p>
            <button
              id="submitButton"
              class="fzp-button fzp-button--primary specular-button specular-button--lg"
              type="submit"
              data-specular-button
            >
              <span class="specular-button__fx" aria-hidden="true"></span>
              <span class="fzp-morph-icon" aria-hidden="true">
                <svg class="fzp-morph-icon__send" viewBox="0 0 24 24">
                  <path d="m22 2-7 20-4-9-9-4Z" />
                  <path d="M22 2 11 13" />
                </svg>
                <svg class="fzp-morph-icon__check" viewBox="0 0 24 24">
                  <path d="m20 6-11 11-5-5" />
                </svg>
              </span>
              <span class="fzp-button__label specular-button__label">进入工作台</span>
            </button>
          </form>
        </div>

        <footer class="fzp-auth__footer">
          <span class="fzp-status-dot" aria-hidden="true"></span>
          加密会话 · 安全访问
        </footer>
      </section>

      <section id="dashboardView" class="legacy-admin" aria-labelledby="dashboardTitle" hidden>
        <div class="legacy-admin__ambient" aria-hidden="true"></div>
        <div class="legacy-admin__container">
          <header class="legacy-admin__header">
            <h1 id="dashboardTitle">解析记录</h1>
            <button id="logoutButton" class="legacy-admin__logout" type="button">登出</button>
          </header>
          <div id="statsGrid" class="legacy-stats" aria-live="polite"></div>
          <div class="legacy-filters">
            <select id="platformFilter">
              <option value="">全部平台</option>
              <option value="douyin">抖音</option>
              <option value="tiktok">TikTok</option>
              <option value="twitter">Twitter</option>
              <option value="bilibili">B站</option>
              <option value="kuaishou">快手</option>
            </select>
            <select id="typeFilter">
              <option value="">全部类型</option>
              <option value="video">视频</option>
              <option value="photo">图片</option>
              <option value="live_photo">动图</option>
            </select>
            <input id="recordSearch" type="search" placeholder="搜索标题..." />
          </div>
          <p id="recordsMessage" class="legacy-records-message" aria-live="polite"></p>
          <div class="legacy-table-wrapper">
            <table>
              <thead>
                <tr><th>时间</th><th>IP / 地址</th><th>平台</th><th>类型</th><th>标题</th><th>链接</th></tr>
              </thead>
              <tbody id="recordRows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
